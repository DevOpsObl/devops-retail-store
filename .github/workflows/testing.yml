name: CI/CD - Testing

on:
  pull_request:
    branches:
      - testing
  push:
    branches:
      - testing
  workflow_dispatch:

concurrency:
  group: retail-store-testing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  code_quality:
    name: Quality
    uses: ./.github/workflows/reusable-code-quality.yml
    secrets: inherit

  security_analysis:
    name: Security
    uses: ./.github/workflows/reusable-security-analysis.yml
    secrets: inherit

  build_images:
    name: Build
    needs:
      - code_quality
      - security_analysis
    uses: ./.github/workflows/reusable-build-images.yml
    with:
      image-tag: ${{ github.sha }}

  automated_tests:
    name: Tests
    needs: build_images
    uses: ./.github/workflows/reusable-automated-tests.yml

  gate_dev_to_test:
    name: Quality gate Dev -> Test
    runs-on: ubuntu-latest
    needs: automated_tests
    if: github.event_name != 'pull_request'
    steps:
      - name: Verify Dev promotion gate
        run: |
          {
            echo "## Quality gate Dev -> Test"
            echo ""
            echo "| Control | Estado |"
            echo "| --- | :---: |"
            echo "| SonarCloud quality gate | Aprobado |"
            echo "| Analisis de seguridad | Aprobado |"
            echo "| Pruebas automatizadas | Aprobado |"
            echo "| Promocion hacia Test | Aprobada |"
            echo ""
            echo "Commit promovido: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Quality gate Dev -> Test aprobado."

  deploy_test:
    name: Deploy Test
    needs: gate_dev_to_test
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: test
      github-environment: Test
      aws-region: us-east-1
      ecr-repository-prefix: devops-retail-store-test
      image-tag: ${{ github.sha }}
    secrets: inherit
