name: CI/CD - Testing

on:
  pull_request:
    branches:
      - testing
  push:
    branches:
      - testing
  workflow_dispatch:

concurrency:
  group: retail-store-testing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  code_quality:
    name: Quality
    uses: ./.github/workflows/reusable-code-quality.yml

  security_analysis:
    name: Security
    uses: ./.github/workflows/reusable-security-analysis.yml

  build_images:
    name: Build
    needs: security_analysis
    uses: ./.github/workflows/reusable-build-images.yml
    with:
      image-tag: ${{ github.sha }}

  automated_tests:
    name: Tests
    needs: build_images
    uses: ./.github/workflows/reusable-automated-tests.yml

  registry_bootstrap:
    name: Registry Bootstrap
    if: github.event_name != 'pull_request'
    needs:
      - code_quality
      - security_analysis
    uses: ./.github/workflows/reusable-registry-bootstrap.yml
    with:
      environment: test
      aws-region: us-east-1
    secrets: inherit

  publish_images:
    name: Publish
    if: github.event_name != 'pull_request'
    needs: registry_bootstrap
    uses: ./.github/workflows/reusable-publish-images.yml
    with:
      aws-region: us-east-1
      ecr-repository-prefix: devops-retail-store-test
      image-tag: ${{ github.sha }}
    secrets: inherit

  gate_dev_to_test:
    name: Quality gate Dev -> Test
    runs-on: ubuntu-latest
    needs: publish_images
    if: github.event_name != 'pull_request'
    steps:
      - name: Verify Dev promotion gate
        run: |
          echo "TODO: definir quality gate entre Dev y Test."
          # TODO: definir umbrales requeridos para promover de Dev a Test.

  deploy_test:
    name: Deploy Test
    needs: gate_dev_to_test
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: test
      github-environment: Test
      aws-region: us-east-1
      image-tag: ${{ github.sha }}
    secrets: inherit
