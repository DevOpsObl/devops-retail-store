name: CI/CD - Testing

on:
  pull_request:
    branches:
      - testing
  push:
    branches:
      - testing
  workflow_dispatch:

concurrency:
  group: retail-store-testing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build_artifacts:
    name: Build
    uses: ./.github/workflows/reusable-build-artifacts.yml
    with:
      node-version: "22"
      go-version: "1.24.x"
      python-version: "3.12"

  automated_tests:
    name: Test
    needs: build_artifacts
    uses: ./.github/workflows/reusable-automated-tests.yml

  code_quality:
    name: Quality
    needs: automated_tests
    uses: ./.github/workflows/reusable-code-quality.yml

  security_analysis:
    name: Security
    needs: automated_tests
    uses: ./.github/workflows/reusable-security-analysis.yml

  publish_images:
    name: Publish
    if: github.event_name != 'pull_request'
    needs:
      - code_quality
      - security_analysis
    uses: ./.github/workflows/reusable-publish-images.yml
    with:
      registry: ghcr.io
      image-prefix: ${{ github.repository }}
      image-tag: ${{ github.sha }}
    secrets: inherit

  gate_dev_to_test:
    name: Quality gate Dev -> Test
    runs-on: ubuntu-latest
    needs: publish_images
    if: github.event_name != 'pull_request'
