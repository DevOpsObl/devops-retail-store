name: CI/CD - Testing

on:
  pull_request:
    branches:
      - testing
  push:
    branches:
      - testing
  workflow_dispatch:

concurrency:
  group: retail-store-testing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  build_images:
    name: Build
    uses: ./.github/workflows/reusable-build-images.yml
    with:
      image-tag: ${{ github.sha }}

  automated_tests:
    name: Test
    needs: build_images
    uses: ./.github/workflows/reusable-automated-tests.yml

  code_quality:
    name: Quality
    needs: automated_tests
    uses: ./.github/workflows/reusable-code-quality.yml

  security_analysis:
    name: Security
    needs: automated_tests
    uses: ./.github/workflows/reusable-security-analysis.yml

  publish_images:
    name: Publish
    if: github.event_name != 'pull_request'
    needs:
      - code_quality
      - security_analysis
    uses: ./.github/workflows/reusable-publish-images.yml
    with:
      aws-region: us-east-1
      ecr-repository-prefix: devops-retail-store-test
      image-tag: ${{ github.sha }}
    secrets: inherit

  gate_dev_to_test:
    name: Quality gate Dev -> Test
    runs-on: ubuntu-latest
    needs: publish_images
    if: github.event_name != 'pull_request'
    steps:
      - name: Verify Dev promotion gate
        run: |
          echo "TODO: definir quality gate entre Dev y Test."
          # TODO: definir umbrales requeridos para promover de Dev a Test.

  deploy_test:
    name: Despliegue Test
    runs-on: ubuntu-latest
    needs: gate_dev_to_test
    if: github.event_name != 'pull_request'
    environment:
      name: Test
    steps:
      - name: Deploy to Test
        run: |
          echo "Promocion aprobada a Test para imagenes tag ${{ github.sha }}"
