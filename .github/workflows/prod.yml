name: CI/CD - Prod

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: retail-store-prod-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  build_images:
    name: Build
    uses: ./.github/workflows/reusable-build-images.yml
    with:
      image-tag: ${{ github.sha }}

  automated_tests:
    name: Tests
    needs: build_images
    uses: ./.github/workflows/reusable-automated-tests.yml

  code_quality:
    name: Quality
    needs: automated_tests
    uses: ./.github/workflows/reusable-code-quality.yml
    secrets: inherit

  security_analysis:
    name: Security
    needs: automated_tests
    uses: ./.github/workflows/reusable-security-analysis.yml

  registry_bootstrap:
    name: Registry Bootstrap
    if: github.event_name != 'pull_request'
    needs:
      - code_quality
      - security_analysis
    uses: ./.github/workflows/reusable-registry-bootstrap.yml
    with:
      environment: prod
      aws-region: us-east-1
    secrets: inherit

  publish_images:
    name: Publish
    if: github.event_name != 'pull_request'
    needs: registry_bootstrap
    uses: ./.github/workflows/reusable-publish-images.yml
    with:
      aws-region: us-east-1
      ecr-repository-prefix: devops-retail-store-prod
      image-tag: ${{ github.sha }}
    secrets: inherit

  gate_test_to_prod:
    name: Quality gate Test -> Prod
    runs-on: ubuntu-latest
    needs: publish_images
    if: github.event_name != 'pull_request'
    steps:
      - name: Verify Test promotion gate
        run: |
          echo "TODO: definir quality gate entre Test y Prod."
          # TODO: definir umbrales requeridos para promover de Test a Prod.
          # TODO: agregar pruebas E2E/regresion contra URL real de Test antes de promover a Prod.
          # curl --fail "${{ vars.TEST_BASE_URL }}/health"

  deploy_prod:
    name: Deploy Prod
    needs: gate_test_to_prod
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: prod
      github-environment: Prod
      aws-region: us-east-1
      image-tag: ${{ github.sha }}
    secrets: inherit
