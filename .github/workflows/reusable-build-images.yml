name: Build de imagenes Docker

on:
  workflow_call:
    inputs:
      image-tag:
        required: true
        type: string

jobs:
  build_images:
    name: "${{ matrix.service.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: Catalog
            tag_name: catalog
            path: src/catalog
          - name: Orders
            tag_name: orders
            path: src/orders
          - name: Checkout
            tag_name: checkout
            path: src/checkout
          - name: UI
            tag_name: ui
            path: src/ui
          - name: Admin
            tag_name: admin
            path: src/admin
          - name: Cart
            tag_name: cart
            path: src/cart
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Docker image
        id: image
        run: |
          service_name_lower="${{ matrix.service.name }}"
          service_name_lower="${service_name_lower,,}"
          image_tag="retail-${service_name_lower}:${{ inputs.image-tag }}"
          echo "uri=${image_tag}" >> "$GITHUB_OUTPUT"
          docker build --tag "$image_tag" ${{ matrix.service.path }}

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ steps.image.outputs.uri }}"
          severity: HIGH,CRITICAL
          exit-code: 1
          trivyignores: ${{ matrix.service.path }}/.trivyignore
