name: Build de imagenes Docker

on:
  workflow_call:
    inputs:
      image-tag:
        required: true
        type: string

jobs:
  build_images:
    name: "${{ matrix.service.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: Catalog
            tag_name: catalog
            path: src/catalog
          - name: Orders
            tag_name: orders
            path: src/orders
          - name: Checkout
            tag_name: checkout
            path: src/checkout
          - name: UI
            tag_name: ui
            path: src/ui
          - name: Admin
            tag_name: admin
            path: src/admin
          - name: Cart
            tag_name: cart
            path: src/cart
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build \
            --tag retail-${{ matrix.service.tag_name }}:${{ inputs.image-tag }} \
            ${{ matrix.service.path }}
