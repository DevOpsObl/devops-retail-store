name: CI/CD - Dev, Test and Prod

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: retail-store-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}
  NODE_VERSION: "22"
  GO_VERSION: "1.24.x"
  PYTHON_VERSION: "3.12"

jobs:
  build_artifacts:
    name: Build / compilacion de artefactos
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: catalog
            path: src/catalog
            type: go
          - name: orders
            path: src/orders
            type: go
          - name: checkout
            path: src/checkout
            type: node-yarn
          - name: ui
            path: src/ui
            type: node-npm
          - name: admin
            path: src/admin
            type: node-npm
          - name: cart
            path: src/cart
            type: python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        if: matrix.service.type == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.service.path }}/go.sum

      - name: Build Go artifact
        if: matrix.service.type == 'go'
        working-directory: ${{ matrix.service.path }}
        run: go build ./...

      - name: Setup Node.js
        if: startsWith(matrix.service.type, 'node')
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install npm dependencies
        if: matrix.service.type == 'node-npm'
        working-directory: ${{ matrix.service.path }}
        run: npm install

      - name: Build npm artifact
        if: matrix.service.type == 'node-npm'
        working-directory: ${{ matrix.service.path }}
        run: npm run build

      - name: Enable Corepack
        if: matrix.service.type == 'node-yarn'
        run: corepack enable

      - name: Install Yarn dependencies
        if: matrix.service.type == 'node-yarn'
        working-directory: ${{ matrix.service.path }}
        run: yarn install --immutable

      - name: Build Yarn artifact
        if: matrix.service.type == 'node-yarn'
        working-directory: ${{ matrix.service.path }}
        run: yarn build

      - name: Setup Python
        if: matrix.service.type == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build Python artifact
        if: matrix.service.type == 'python'
        working-directory: ${{ matrix.service.path }}
        run: python -m compileall app

