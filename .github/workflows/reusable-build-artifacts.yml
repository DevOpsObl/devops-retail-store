name: Reusable - Build de artefactos

on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string
      go-version:
        required: true
        type: string
      python-version:
        required: true
        type: string

jobs:
  build_artifacts:
    name: Build de artefactos - ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: catalog
            path: src/catalog
            type: go
          - name: orders
            path: src/orders
            type: go
          - name: checkout
            path: src/checkout
            type: node-yarn
          - name: ui
            path: src/ui
            type: node-npm
          - name: admin
            path: src/admin
            type: node-npm
          - name: cart
            path: src/cart
            type: python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        if: matrix.service.type == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache-dependency-path: ${{ matrix.service.path }}/go.sum

      - name: Build Go artifact
        if: matrix.service.type == 'go'
        working-directory: ${{ matrix.service.path }}
        run: go build ./...

      - name: Setup Node.js
        if: startsWith(matrix.service.type, 'node')
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install npm dependencies
        if: matrix.service.type == 'node-npm'
        working-directory: ${{ matrix.service.path }}
        run: npm install

      - name: Build npm artifact
        if: matrix.service.type == 'node-npm'
        working-directory: ${{ matrix.service.path }}
        run: npm run build

      - name: Enable Corepack
        if: matrix.service.type == 'node-yarn'
        run: corepack enable

      - name: Install Yarn dependencies
        if: matrix.service.type == 'node-yarn'
        working-directory: ${{ matrix.service.path }}
        run: yarn install --immutable

      - name: Build Yarn artifact
        if: matrix.service.type == 'node-yarn'
        working-directory: ${{ matrix.service.path }}
        run: yarn build

      - name: Setup Python
        if: matrix.service.type == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Build Python artifact
        if: matrix.service.type == 'python'
        working-directory: ${{ matrix.service.path }}
        run: python -m compileall app
