name: CI/CD - Develop

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: retail-store-develop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  build_images:
    name: Build
    uses: ./.github/workflows/reusable-build-images.yml
    with:
      image-tag: ${{ github.sha }}

  automated_tests:
    name: Test
    needs: build_images
    uses: ./.github/workflows/reusable-automated-tests.yml

  code_quality:
    name: Quality
    needs: automated_tests
    uses: ./.github/workflows/reusable-code-quality.yml

  security_analysis:
    name: Security
    needs: automated_tests
    uses: ./.github/workflows/reusable-security-analysis.yml

  publish_images:
    name: Publish
    if: github.event_name != 'pull_request'
    needs:
      - code_quality
      - security_analysis
    uses: ./.github/workflows/reusable-publish-images.yml
    with:
      aws-region: us-east-1
      ecr-repository-prefix: devops-retail-store-dev
      image-tag: ${{ github.sha }}
    secrets: inherit

  deploy_dev:
    name: Despliegue Dev
    runs-on: ubuntu-latest
    needs: publish_images
    if: github.event_name != 'pull_request'
    environment:
      name: Develop
    steps:
      - name: Deploy to Dev
        run: |
          echo "Promocion aprobada a Dev para imagenes tag ${{ github.sha }}"
          # TODO: ejecutar Terraform para actualizar ECS usando image_tag=${{ github.sha }}.
