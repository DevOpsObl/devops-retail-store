name: CI/CD - Develop

on:
  pull_request:
    branches:
      - develop

concurrency:
  group: retail-store-develop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build_artifacts:
    uses: ./.github/workflows/reusable-build-artifacts.yml
    with:
      node-version: "22"
      go-version: "1.24.x"
      python-version: "3.12"

  automated_tests:
    needs: build_artifacts
    uses: ./.github/workflows/reusable-automated-tests.yml

  code_quality:
    needs: automated_tests
    uses: ./.github/workflows/reusable-code-quality.yml

  security_analysis:
    needs: automated_tests
    uses: ./.github/workflows/reusable-security-analysis.yml

  publish_images:
    needs:
      - code_quality
      - security_analysis
    uses: ./.github/workflows/reusable-publish-images.yml
    with:
      registry: ghcr.io
      image-prefix: ${{ github.repository }}
      image-tag: ${{ github.sha }}
    secrets: inherit

  deploy_dev:
    name: Despliegue Dev
    runs-on: ubuntu-latest
    needs: publish_images
    environment:
      name: Develop
    steps:
      - name: Deploy to Dev
        run: |
          echo "Promocion aprobada a Dev para imagenes tag ${{ github.sha }}"
          # TODO: definir como se desplegara al ambiente Dev.
          # TODO: agregar kubeconfig/credenciales del ambiente Dev.
          # TODO: agregar manifiestos Kubernetes o charts Helm.
          # Ejemplo:
          # helm upgrade --install retail-store ./deploy/helm/retail-store \
          #   --namespace retail-dev --create-namespace \
          #   --set global.imageTag=${{ github.sha }}
