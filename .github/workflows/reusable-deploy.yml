name: Deploy ECS

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      github-environment:
        required: true
        type: string
      aws-region:
        required: true
        type: string
      image-tag:
        required: true
        type: string
      terraform-version:
        required: false
        type: string
        default: "1.12.0"
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_SESSION_TOKEN:
        required: false
      ADMIN_PASSWORD:
        required: false

jobs:
  deploy:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.github-environment }}
    env:
      AWS_REGION: ${{ inputs.aws-region }}
      TF_ENV: ${{ inputs.environment }}
      IMAGE_TAG: ${{ inputs.image-tag }}
      TF_VAR_admin_password: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform-version }}

      - name: Terraform init
        run: |
          terraform -chdir=infra/environment init \
            -reconfigure \
            -backend-config=backend/${TF_ENV}.hcl

      - name: Terraform plan
        run: |
          terraform -chdir=infra/environment plan \
            -var-file=tfvars/${TF_ENV}.tfvars \
            -var="image_tag=${IMAGE_TAG}"

      - name: Terraform apply
        run: |
          terraform -chdir=infra/environment apply -auto-approve \
            -var-file=tfvars/${TF_ENV}.tfvars \
            -var="image_tag=${IMAGE_TAG}"

      - name: Publicar URLs desplegadas
        run: |
          alb_dns_name=$(terraform -chdir=infra/environment output -raw alb_dns_name)

          {
            echo "## URLs desplegadas"
            echo ""
            echo "- UI: http://${alb_dns_name}/"
            echo "- Admin: http://${alb_dns_name}/admin/"
          } >> "$GITHUB_STEP_SUMMARY"
